name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you try, what did you expect, what did GoOffline do instead?
      placeholder: "I added Chrome, flipped the switch, and ..."
    validations: { required: true }
  - type: input
    id: program
    attributes:
      label: Which program were you blocking?
      placeholder: Chrome / Steam / Spotify / ...
  - type: dropdown
    id: mode
    attributes:
      label: Tier
      options: [Firewall only, Hard mode on]
    validations: { required: true }
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: version
    attributes:
      label: GoOffline version
      placeholder: v0.1.0
  - type: textarea
    id: status
    attributes:
      label: Status-bar text (if any)
      description: The message at the bottom of GoOffline's window.
