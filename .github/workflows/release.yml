name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Build native hook DLLs
        shell: pwsh
        run: ./native/GoOfflineHook/build.ps1

      - name: Publish single-file exe
        shell: pwsh
        run: dotnet publish src/GoOffline -c Release -o publish

      - name: Zip release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "dev" }
          Compress-Archive -Path publish\* -DestinationPath "GoOffline-$ver-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GoOffline-*-win-x64.zip
          generate_release_notes: true
          body: |
            ## GoOffline ${{ github.ref_name }}

            Download `GoOffline-${{ github.ref_name }}-win-x64.zip` below, extract, and run `GoOffline.exe`.
            Windows 10 & 11 only. Requires admin for firewall edits (prompted on launch).
